<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>항목 추가/수정</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4caf50">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
  <!--
    항목 추가/수정 화면
    - 주소 뒤에 ?id=아이디 가 붙어 있으면 "수정 모드"로 동작합니다.
      예) add.html?id=1699999999999
    - id가 없으면 "추가 모드"로 동작합니다.
    - 모드에 따른 처리는 js/form.js 에서 합니다.
  -->
  <header class="app-header">
    <a href="index.html" class="back-btn" aria-label="목록으로 돌아가기">&larr;</a>
    <h1 id="form-title">항목 추가</h1>
  </header>

  <main>
    <form id="item-form" class="item-form">
      <label for="name">품목명</label>
      <input type="text" id="name" placeholder="예: 우유, 계란, 스킨로션" required>

      <!-- 카메라로 바코드를 찍으면 Open Food Facts에서 제품명을 찾아 위 입력칸에 채워줍니다 -->
      <button type="button" id="barcode-scan-btn" class="barcode-btn">📷 바코드로 자동 입력</button>
      <!-- 조회 성공/실패 안내 문구가 뜨는 자리 (팝업 대신 여기에 조용히 표시) -->
      <p id="barcode-message" class="barcode-message"></p>

      <label>카테고리</label>
      <!-- 라디오 버튼을 버튼처럼 꾸민 것입니다. required를 걸어서 하나는 꼭 고르도록 합니다. -->
      <div class="category-options" role="radiogroup" aria-label="카테고리 선택">
        <label class="category-option">
          <input type="radio" name="category" value="상온" required>
          <span>🥫 상온</span>
        </label>
        <label class="category-option">
          <input type="radio" name="category" value="냉장" required>
          <span>🧊 냉장</span>
        </label>
        <label class="category-option">
          <input type="radio" name="category" value="냉동" required>
          <span>❄️ 냉동</span>
        </label>
        <label class="category-option">
          <input type="radio" name="category" value="화장품" required>
          <span>🧴 화장품</span>
        </label>
      </div>

      <label for="purchaseDate">구매일</label>
      <input type="date" id="purchaseDate" required>

      <label for="expiryDate">유통기한</label>
      <input type="date" id="expiryDate" required>

      <!-- 구매일 기준으로 며칠 뒤인지 버튼으로 빠르게 선택할 수 있습니다 -->
      <div class="quick-buttons">
        <button type="button" class="quick-btn" data-days="3">+3일</button>
        <button type="button" class="quick-btn" data-days="7">+7일</button>
        <button type="button" class="quick-btn" data-days="14">+14일</button>
        <button type="button" class="quick-btn" data-days="30">+30일</button>
      </div>

      <label for="alertDays">며칠 전부터 알림을 받을까요?</label>
      <input type="number" id="alertDays" min="1" max="30" step="1" value="3" required>

      <label for="memo">메모 (선택)</label>
      <textarea id="memo" placeholder="예: 냉장고 안쪽 칸, 개봉 후 3일 이내 사용"></textarea>

      <button type="submit" class="save-btn">저장</button>
      <!-- 삭제 버튼은 수정 모드일 때만 form.js가 보이도록 만듭니다 -->
      <button type="button" id="delete-btn" class="delete-btn" style="display: none;">삭제</button>
    </form>
  </main>

  <!--
    바코드 스캔 화면 (평소엔 hidden 속성으로 숨겨져 있다가, "바코드로 자동 입력" 버튼을
    누르면 js/barcode.js가 hidden을 풀어서 화면 전체를 덮는 카메라 화면을 보여줍니다)
  -->
  <div id="barcode-scanner-overlay" class="scanner-overlay" hidden>
    <div class="scanner-box">
      <div class="scanner-header">
        <span>바코드 스캔</span>
        <button type="button" id="scanner-close-btn" class="scanner-close-btn" aria-label="닫기">✕</button>
      </div>
      <!-- html5-qrcode 라이브러리가 이 안에 카메라 영상을 그려줍니다 -->
      <div id="barcode-reader"></div>
      <p id="scanner-status" class="scanner-status"></p>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/dateUtils.js"></script>
  <script src="js/form.js"></script>
  <!-- 바코드 스캔 라이브러리 (npm 설치 없이 CDN에서 바로 불러와서 사용합니다) -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="js/barcode.js"></script>
</body>
</html>
