<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    앱 아이콘 (유통기한 관리)
    - 앱 전체 리디자인에서 쓰는 색 팔레트(세이지 그린 / 크림 / 차콜)를 그대로 반영했습니다.
    - 배경: 크림색 둥근 사각형 (앱의 페이지 배경과 같은 톤)
    - 가운데: 흰 카드 위에 세이지 그린 캘린더 모양 (캘린더 화면 아이콘과 같은 모티브)
    - 오른쪽 아래: 차분한 테라코타(붉은흙) 배지 = "유통기한 임박" 알림을 뜻하는 포인트
    벡터(SVG)라서 192x192, 512x512 등 어떤 크기로 써도 화질이 깨지지 않습니다.
    (scripts/generate-icons.js가 이 파일을 읽어서 icon-192.png, icon-512.png를 만듭니다)
  -->

  <!-- 배경 (둥근 사각형, 크림색) -->
  <rect x="0" y="0" width="512" height="512" rx="110" fill="#f3efe6" />

  <!-- 캘린더 몸통 (흰색 카드) -->
  <rect x="96" y="150" width="320" height="270" rx="28" fill="#ffffff" />

  <!-- 캘린더 상단 헤더 바 (세이지 그린) -->
  <path d="M96 178a28 28 0 0 1 28-28h236a28 28 0 0 1 28 28v46H96z" fill="#536b4f" />

  <!-- 상단 스프링 링 두 개 (세이지 그린) -->
  <rect x="150" y="112" width="28" height="66" rx="14" fill="#536b4f" />
  <rect x="334" y="112" width="28" height="66" rx="14" fill="#536b4f" />

  <!-- 캘린더 안쪽 날짜 칸 (연한 세이지 그린) -->
  <g fill="#e6ebe1">
    <rect x="132" y="252" width="52" height="40" rx="8" />
    <rect x="202" y="252" width="52" height="40" rx="8" />
    <rect x="272" y="252" width="52" height="40" rx="8" />
    <rect x="132" y="312" width="52" height="40" rx="8" />
    <rect x="202" y="312" width="52" height="40" rx="8" />
  </g>

  <!-- 오늘 날짜 칸 (강조, 진한 세이지 그린) -->
  <rect x="272" y="312" width="52" height="40" rx="8" fill="#536b4f" />

  <!-- 유통기한 임박을 뜻하는 배지 (차분한 테라코타) -->
  <circle cx="400" cy="380" r="46" fill="#9f5240" stroke="#f3efe6" stroke-width="10" />
  <rect x="392" y="358" width="16" height="30" rx="8" fill="#ffffff" />
  <circle cx="400" cy="400" r="8" fill="#ffffff" />
</svg>
