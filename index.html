<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유통기한 관리</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#536b4f">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
  <!-- ===== [테스트용, 나중에 제거] eruda 모바일 디버깅 도구 시작 =====
       평소에는 아예 로드되지 않습니다. 주소 끝에 ?debug=true를 붙여서
       접속했을 때만(예: index.html?debug=true) 화면 구석에 작은 버튼이
       뜨고, 누르면 콘솔 로그/네트워크 요청을 휴대폰에서 바로 볼 수 있습니다.
       문제 해결이 끝나면 이 블록(시작~끝 주석 사이)을 통째로 지우면 됩니다. -->
  <script>
    if (new URLSearchParams(window.location.search).get("debug") === "true") {
      var erudaScript = document.createElement("script");
      erudaScript.src = "https://cdn.jsdelivr.net/npm/eruda";
      erudaScript.onload = function () {
        eruda.init();
        // eruda는 내부적으로 Shadow DOM을 사용해서 화면을 그리기 때문에, 일반적인
        // <style> 태그(바깥 CSS)로는 eruda 패널 크기를 조정할 수 없습니다.
        // 그래서 eruda 내부의 shadowRoot 안에 직접 <style>을 넣어줍니다.
        // max-height를 쓰면(높이를 고정하지 않고) 사용자가 손으로 더 작게 줄이는 것도
        // 그대로 되면서, 기본값(80%)이나 리사이즈로 다시 커지는 것만 막아줍니다.
        var erudaShadowRoot = document.getElementById("eruda").shadowRoot;
        var erudaSizeStyle = document.createElement("style");
        erudaSizeStyle.textContent =
          ".eruda-dev-tools { max-height: 32vh !important; }";
        erudaShadowRoot.appendChild(erudaSizeStyle);
      };
      document.head.appendChild(erudaScript);
    }
  </script>
  <!-- ===== [테스트용, 나중에 제거] eruda 모바일 디버깅 도구 끝 ===== -->

  <!--
    메인 화면(목록 화면)
    - 저장된 항목들을 유통기한이 임박한 순서로 보여줍니다.
    - 실제 목록을 그리는 코드는 js/main.js 에 있습니다.
  -->
  <header class="app-header">
    <h1>유통기한 관리</h1>
    <a href="calendar.html" class="calendar-btn" aria-label="캘린더 보기">📅</a>
    <a href="add.html" class="add-btn">+ 추가</a>
  </header>

  <main class="page-main">
    <!-- 남은 일수가 alertDays 이하인 항목을 모아서 강조해서 보여주는 영역 (main.js가 채움) -->
    <section id="alert-section" class="alert-section"></section>

    <!--
      카테고리 필터 탭: 누르면 main.js가 해당 카테고리 항목만 보여줍니다.
      아이콘(.tab-icon-slot 안)은 비어있는 채로 두고, main.js가 js/icons.js의
      CATEGORY_ICONS_SVG를 읽어서 채워 넣습니다. (목록 카드/추가 화면의
      카테고리 선택과 완전히 같은 아이콘을 쓰기 위해 한 곳에서만 관리합니다)
    -->
    <div id="category-tabs" class="category-tabs">
      <button type="button" class="category-tab active" data-category="all">
        <span class="tab-icon-slot"></span>
        <span class="tab-label">전체</span>
      </button>
      <button type="button" class="category-tab" data-category="상온">
        <span class="tab-icon-slot"></span>
        <span class="tab-label">상온</span>
      </button>
      <button type="button" class="category-tab" data-category="냉장">
        <span class="tab-icon-slot"></span>
        <span class="tab-label">냉장</span>
      </button>
      <button type="button" class="category-tab" data-category="냉동">
        <span class="tab-icon-slot"></span>
        <span class="tab-label">냉동</span>
      </button>
      <button type="button" class="category-tab" data-category="화장품">
        <span class="tab-icon-slot"></span>
        <span class="tab-label">화장품</span>
      </button>
    </div>

    <ul id="item-list" class="item-list">
      <!-- main.js가 실행되면서 이 자리에 항목들을 자동으로 채워줍니다 -->
    </ul>
  </main>

  <!--
    스크립트는 아래 순서로 불러와야 합니다.
    1) storage.js  : localStorage에 데이터를 읽고 쓰는 함수 모음
    2) icons.js    : 카테고리별 SVG 아이콘 모음
    3) dateUtils.js: 날짜 계산(D-day 등) 함수 모음
    4) main.js     : 위 파일들의 함수를 이용해서 화면(목록)을 그림
  -->
  <script src="js/storage.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/dateUtils.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
