<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유통기한 관리</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4caf50">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
  <!-- ===== [테스트용, 나중에 제거] eruda 모바일 디버깅 도구 시작 =====
       휴대폰 화면 구석에 작은 버튼이 뜨고, 누르면 콘솔 로그/네트워크 요청을
       휴대폰에서 바로 볼 수 있습니다. 다른 스크립트보다 먼저 로드해야
       그 스크립트들이 찍는 console.log도 놓치지 않고 잡아낼 수 있습니다.
       문제 해결이 끝나면 이 두 줄(시작~끝 주석 사이)을 통째로 지우면 됩니다. -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  <!-- ===== [테스트용, 나중에 제거] eruda 모바일 디버깅 도구 끝 ===== -->

  <!--
    메인 화면(목록 화면)
    - 저장된 항목들을 유통기한이 임박한 순서로 보여줍니다.
    - 실제 목록을 그리는 코드는 js/main.js 에 있습니다.
  -->
  <header class="app-header">
    <h1>유통기한 관리</h1>
    <a href="calendar.html" class="calendar-btn" aria-label="캘린더 보기">📅</a>
    <a href="add.html" class="add-btn">+ 추가</a>
  </header>

  <main>
    <!-- 남은 일수가 alertDays 이하인 항목을 모아서 강조해서 보여주는 영역 (main.js가 채움) -->
    <section id="alert-section" class="alert-section"></section>

    <!-- 카테고리 필터 탭: 누르면 main.js가 해당 카테고리 항목만 보여줍니다 -->
    <div id="category-tabs" class="category-tabs">
      <button type="button" class="category-tab active" data-category="all">전체</button>
      <button type="button" class="category-tab" data-category="상온">🥫 상온</button>
      <button type="button" class="category-tab" data-category="냉장">🧊 냉장</button>
      <button type="button" class="category-tab" data-category="냉동">❄️ 냉동</button>
      <button type="button" class="category-tab" data-category="화장품">🧴 화장품</button>
    </div>

    <ul id="item-list" class="item-list">
      <!-- main.js가 실행되면서 이 자리에 항목들을 자동으로 채워줍니다 -->
    </ul>
  </main>

  <!--
    스크립트는 아래 순서로 불러와야 합니다.
    1) storage.js  : localStorage에 데이터를 읽고 쓰는 함수 모음
    2) dateUtils.js: 날짜 계산(D-day 등) 함수 모음
    3) main.js     : 위 두 파일의 함수를 이용해서 화면(목록)을 그림
  -->
  <script src="js/storage.js"></script>
  <script src="js/dateUtils.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
